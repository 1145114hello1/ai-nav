<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 官网导航</title>
  <style>
    :root {
      --bg: #f5f6f7;
      --surface: #ffffff;
      --border: #e6e8ea;
      --border-strong: #d4d7da;
      --text: #191b1e;
      --muted: #6b7280;
      --faint: #9aa1a9;
      --accent: #0c8a6d;
      --accent-strong: #08745c;
      --accent-soft: #e7f4ef;
      --danger: #b3343c;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
      --shadow-hover: 0 8px 24px rgba(16, 24, 40, 0.10);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 246, 247, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #0c8a6d, #0b6f58);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .count-pill {
      flex-shrink: 0;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .count-pill b {
      color: var(--text);
      font-weight: 700;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(12, 138, 109, 0.16);
    }

    .search-box svg {
      flex-shrink: 0;
      color: var(--muted);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .search-box input::placeholder {
      color: var(--faint);
    }

    .clear-btn {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .clear-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    .chips {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13.5px;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: var(--radius);
      background: #ffffff;
      border: 1px solid var(--border);
      overflow: hidden;
      user-select: none;
    }

    .logo-mono {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0;
    }

    .logo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 7px;
      background: #ffffff;
      box-sizing: border-box;
    }

    .card-head {
      min-width: 0;
      flex: 1;
    }

    .card-head h2 {
      margin: 1px 0 3px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .copy-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 6px;
      color: var(--faint);
      border: 1px solid transparent;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .copy-btn:hover {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: #cde7dd;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 42px;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    .host {
      min-width: 0;
      color: var(--faint);
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .visit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 7px;
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 650;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .visit-btn:hover {
      background: var(--accent-strong);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 56px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 17px;
      margin-bottom: 6px;
    }

    .footer {
      margin: 30px 20px 0;
      text-align: center;
      color: var(--faint);
      font-size: 12.5px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 18px);
      padding: 10px 16px;
      border-radius: 8px;
      background: #202326;
      color: #ffffff;
      font-size: 13.5px;
      box-shadow: var(--shadow-hover);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 560px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .header-inner {
        padding-left: 14px;
        padding-right: 14px;
      }

      .brand h1 {
        font-size: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .desc {
        min-height: auto;
      }
    }
  </style>
</head>

      { n: "腾讯元宝", c: "office", d: "腾讯推出的 AI 助手", u: "https://yuanbao.tencent.com", color: "#2f80ed" },
      { n: "飞书智能伙伴", c: "office", d: "飞书内置的办公 AI 助手", u: "https://www.feishu.cn/product/ai", color: "#3370ff" },
      { n: "WPS AI", c: "office", d: "WPS 办公套件的 AI 能力", u: "https://ai.wps.cn", color: "#ef4444" },
      { n: "Zapier", c: "office", d: "AI 驱动的自动化工作流", u: "https://zapier.com", color: "#ff4f00" },
      { n: "n8n", c: "office", d: "开源自动化工作流平台", u: "https://n8n.io", color: "#ea4b71" },

      { n: "Elicit", c: "research", d: "AI 科研文献检索与总结", u: "https://elicit.com", color: "#6366f1" },
      { n: "Semantic Scholar", c: "research", d: "学术文献智能搜索引擎", u: "https://www.semanticscholar.org", color: "#1857b6" },
      { n: "Consensus", c: "research", d: "基于科研论文的 AI 搜索", u: "https://consensus.app", color: "#2563eb" },
      { n: "Connected Papers", c: "research", d: "论文关联关系可视化", u: "https://www.connectedpapers.com", color: "#111111" },
      { n: "Scite", c: "research", d: "智能引用分析与文献验证", u: "https://scite.ai", color: "#2563eb" },
      { n: "Research Rabbit", c: "research", d: "文献推荐与知识图谱", u: "https://researchrabbitapp.com", color: "#f97316" },
      { n: "SciSpace", c: "research", d: "论文阅读、写作与交流", u: "https://scispace.com", color: "#0ea5e9" },

      { n: "OpenAI", c: "platform", d: "AI 模型、产品与 API 平台", u: "https://openai.com", color: "#10a37f" },
      { n: "Anthropic", c: "platform", d: "Claude 系列模型与 API", u: "https://www.anthropic.com", color: "#d97757" },
      { n: "Google AI", c: "platform", d: "Google 的 AI 研究与产品", u: "https://ai.google", color: "#4285f4" },
      { n: "Meta AI", c: "platform", d: "Meta 的 AI 助手与研究", u: "https://www.meta.ai", color: "#0866ff" },
      { n: "Hugging Face", c: "platform", d: "开源模型、数据集与社区", u: "https://huggingface.co", color: "#d4a017" },
      { n: "NVIDIA AI", c: "platform", d: "AI 计算平台与模型生态", u: "https://www.nvidia.com/en-us/ai", color: "#76b900" },
      { n: "Mistral AI", c: "platform", d: "欧洲领先的开源模型公司", u: "https://mistral.ai", color: "#ff7000" },
      { n: "Cohere", c: "platform", d: "面向企业的语言模型平台", u: "https://cohere.com", color: "#39594d" },
      { n: "Together AI", c: "platform", d: "开源模型推理与训练平台", u: "https://www.together.ai", color: "#111111" },
      { n: "Replicate", c: "platform", d: "云端模型托管与运行", u: "https://replicate.com", color: "#111111" },
      { n: "Fireworks AI", c: "platform", d: "高性能生成式 AI 推理", u: "https://fireworks.ai", color: "#ef4444" },

      { n: "Manus", c: "agent", d: "通用型自主智能体", u: "https://manus.im", color: "#111111" },
      { n: "AutoGPT", c: "agent", d: "自主任务执行智能体", u: "https://autogpt.net", color: "#111111" },
      { n: "LangChain", c: "agent", d: "LLM 应用开发框架", u: "https://www.langchain.com", color: "#1c3c3c" },
      { n: "CrewAI", c: "agent", d: "多智能体协作框架", u: "https://www.crewai.com", color: "#ef4444" },
      { n: "Dify", c: "agent", d: "开源 LLM 应用开发平台", u: "https://dify.ai", color: "#2563eb" },
      { n: "扣子 Coze", c: "agent", d: "字节跳动的智能体开发平台", u: "https://www.coze.cn", color: "#111111" }
    ];

    const ICONS = {
      external: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>',
      copy: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>'
    };

    const grid = document.getElementById("grid");
    const chipsEl = document.getElementById("chips");
    const searchEl = document.getElementById("search");
    const clearEl = document.getElementById("clear");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const toastEl = document.getElementById("toast");

    let activeCategory = "all";
    let query = "";
    let toastTimer = null;

    function catName(id) {
      return CATEGORIES.find((c) => c.id === id)?.name || "";
    }

    function hostOf(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch {
        return url;
      }
    }

    function textColor(hex) {
      const raw = hex.replace("#", "");
      const full = raw.length === 3 ? raw.split("").map((x) => x + x).join("") : raw;
      const r = parseInt(full.slice(0, 2), 16);
      const g = parseInt(full.slice(2, 4), 16);
      const b = parseInt(full.slice(4, 6), 16);
      const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      return luminance > 0.62 ? "#191b1e" : "#ffffff";
    }

    function renderChips() {
      chipsEl.innerHTML = CATEGORIES.map((cat) =>
        `<button class="chip${cat.id === activeCategory ? " active" : ""}" type="button" data-cat="${cat.id}">${cat.name}</button>`
      ).join("");
    }

    function render() {
      const q = query.trim().toLowerCase();
      const list = DATA.filter((item) => {
        const matchCat = activeCategory === "all" || item.c === activeCategory;
        if (!matchCat) return false;
        if (!q) return true;
        const haystack = [item.n, item.d, catName(item.c), hostOf(item.u), item.u].join(" ").toLowerCase();
        return haystack.includes(q);
      });

      countEl.textContent = list.length;
      emptyEl.hidden = list.length > 0;

      grid.innerHTML = list.map((item) => {
        const initial = item.n.trim().charAt(0);
        const color = textColor(item.color);
        const logoSrc = hostOf(item.u).replace(/\./g, "-") + ".png";
        return `
          <article class="card">
            <div class="card-top">
              <span class="logo" aria-hidden="true">
                <span class="logo-mono" style="background:${item.color};color:${color}">${initial}</span>
                <img class="logo-img" src="logos/${logoSrc}" alt="" loading="lazy" onerror="this.remove()">
              </span>
              <div class="card-head">
                <h2>${item.n}</h2>
                <span class="tag">${catName(item.c)}</span>
              </div>
              <button class="copy-btn" type="button" data-url="${item.u}" title="复制链接" aria-label="复制链接">${ICONS.copy}</button>
            </div>
            <p class="desc">${item.d}</p>
            <div class="card-foot">
              <span class="host">${hostOf(item.u)}</span>
              <a class="visit-btn" href="${item.u}" target="_blank" rel="noopener noreferrer">官网 ${ICONS.external}</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    function updateSearchUI() {
      clearEl.hidden = searchEl.value.length === 0;
    }

    chipsEl.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      activeCategory = chip.dataset.cat;
      renderChips();
      render();
    });

    searchEl.addEventListener("input", () => {
      query = searchEl.value;
      updateSearchUI();
      render();
    });

    clearEl.addEventListener("click", () => {
      searchEl.value = "";
      query = "";
      updateSearchUI();
      render();
      searchEl.focus();
    });

    grid.addEventListener("click", (event) => {
      const btn = event.target.closest(".copy-btn");
      if (!btn) return;
      const url = btn.dataset.url;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => showToast("链接已复制")).catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("链接已复制");
      } catch {
        showToast("复制失败，请手动复制");
      }
      document.body.removeChild(ta);
    }

    renderChips();
    render();
  </script>
</body>
</html>
